amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 52.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 360
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: false  # HDL localization이 map->odom을 발행하므로 AMCL은 TF 발행 비활성화
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001  # Swerve: reduced from 0.5 to allow small lateral movements
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    current_goal_checker: "general_goal_checker"  # Warning resolution
    current_progress_checker: "progress_checker"  # Warning resolution

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 1.6
      movement_time_allowance: 10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      # Swerve robot: omnidirectional movement enabled
      min_vel_x: 0.0
      min_vel_y: -1.5  # Swerve: allow backward lateral movement
      max_vel_x: 1.5   # Keep original speed for performance
      max_vel_y: 1.5   # Swerve: allow lateral movement
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 1.5  # Keep original speed for performance
      min_speed_theta: 0.0
      acc_lim_x: 3.0   # Reduced acceleration for better obstacle avoidance and stability
      acc_lim_y: 3.0   # Swerve: reduced lateral acceleration for safety
      acc_lim_theta: 3.0  # Reduced angular acceleration for stability
      decel_lim_x: -3.0  # Stronger deceleration for emergency stops
      decel_lim_y: -3.0  # Swerve: stronger lateral deceleration
      decel_lim_theta: -3.0
      vx_samples: 20
      vy_samples: 20   # Swerve: increase samples for lateral movement
      vtheta_samples: 20
      sim_time: 1.5    # Reduced for more responsive control
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.5  # TF extrapolation 방지를 위해 증가 (0.2 -> 0.5)
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      limit_vel_cmd_in_traj: False
      stateful: True
      # Swerve: removed RotateToGoal (causes excessive rotation), focus on path following
      # BaseObstacle first for priority obstacle avoidance
      critics: ["BaseObstacle", "Oscillation", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 2.0  # CRITICAL: Strong obstacle avoidance (was 0.02, now 2.0)
      Oscillation.scale: 10.0  # Swerve: oscillation detection for omnidirectional movement
      PathAlign.scale: 8.0     # Reduced significantly to prioritize obstacle avoidance
      GoalAlign.scale: 6.0     # Reduced significantly to prioritize obstacle avoidance
      PathAlign.forward_point_distance: 0.5  # Swerve: increased for smoother path following (was 0.3)
      GoalAlign.forward_point_distance: 0.5  # Swerve: increased for smoother goal alignment (was 0.3)
      PathDist.scale: 8.0      # Reduced significantly to prioritize obstacle avoidance
      GoalDist.scale: 6.0      # Reduced significantly to prioritize obstacle avoidance
      # RotateToGoal removed for Swerve - robot can move in any direction without rotating
      # plugin: "nav2_mppi_controller::MPPIController"
      # time_steps: 56
      # model_dt: 0.05
      # batch_size: 2000
      # ax_max: 3.0
      # ax_min: -3.0
      # ay_max: 3.0
      # ay_min: -3.0
      # az_max: 3.5
      # vx_std: 0.2
      # vy_std: 0.2
      # wz_std: 0.4
      # vx_max: 2.0
      # vx_min: -0.35
      # vy_max: 0.5
      # wz_max: 1.9
      # iteration_count: 1
      # prune_distance: 1.7
      # transform_tolerance: 0.5  # TF extrapolation 방지를 위해 증가 (0.1 -> 0.5)
      # temperature: 0.3
      # gamma: 0.015
      # motion_model: "DiffDrive"
      # visualize: true
      # regenerate_noises: true
      # TrajectoryVisualizer:
      #   trajectory_step: 5
      #   time_step: 3
      # AckermannConstraints:
      #   min_turning_r: 0.2
      # critics: [
      #   "ConstraintCritic", "CostCritic", "GoalCritic",
      #   "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
      #   "PathAngleCritic", "PreferForwardCritic"]
      # ConstraintCritic:
