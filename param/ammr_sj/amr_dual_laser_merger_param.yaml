/**:
  ros__parameters:
    # Topic Configuration
    laser_1_topic: "/scan_front"              # First laser scan topic name
    laser_2_topic: "/scan_rear"              # Second laser scan topic name
    merged_scan_topic: "/scan"                # Merged LaserScan output topic
    merged_cloud_topic: "/cloud"         # Merged PointCloud2 output topic
    
    # Target Frame Configuration
    target_frame: "base_scan"                  # Target frame for merged scan (required)
    
    # Synchronization Parameters
    tolerance: 0.05                            # Time tolerance for message synchronization (seconds)
    queue_size: 10                              # Input queue size for message synchronization
    
    # LaserScan Output Parameters
    angle_min: -3.141592654                    # Minimum angle of merged scan (radians)
    angle_max: 3.141592654                     # Maximum angle of merged scan (radians)
    angle_increment: 0.001                      # Angular resolution of merged scan (radians)
    scan_time: 0.07                           # Time between scans (seconds)
    range_min: 0.01                            # Minimum range value (meters)
    range_max: 40.0                            # Maximum range value (meters)
    
    # Height Filter Parameters
    min_height: -1.0                           # Minimum height filter (meters)
    max_height: 1.0                            # Maximum height filter (meters)
    
    # Infinite Range Parameters
    inf_epsilon: 1.0                           # Epsilon value for infinite range representation
    use_inf: true                              # Use infinity for invalid ranges (true) or range_max + epsilon (false)
    
    # Calibration Parameters - Laser 1
    laser_1_x_offset: 0.0                      # X offset for laser 1 calibration (meters)
    laser_1_y_offset: 0.0                      # Y offset for laser 1 calibration (meters)
    laser_1_yaw_offset: 0.0                    # Yaw offset for laser 1 calibration (radians)
    
    # Calibration Parameters - Laser 2
    laser_2_x_offset: 0.0                     # X offset for laser 2 calibration (meters)
    laser_2_y_offset: 0.0                      # Y offset for laser 2 calibration (meters)
    laser_2_yaw_offset: 0.0                    # Yaw offset for laser 2 calibration (radians)
    
    # Filter Parameters
    enable_average_filter: true                 # Enable average filter for noise reduction
    enable_shadow_filter: true                  # Enable shadow filter to remove isolated points
    allowed_radius: 0.45                        # Allowed radius for shadow filter (meters)

    # Robot Body Filter
    robot_length: 1.244                           # Robot length (x-axis) to filter out points within robot body (meters). Set to 0 to disable.
    robot_width: 0.794                            # Robot width (y-axis) to filter out points within robot body (meters). Set to 0 to disable.
    
    # Runtime Calibration
    enable_calibration: false                   # Enable runtime parameter calibration (allows parameter updates during runtime)

